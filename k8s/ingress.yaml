apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autospec-web
  namespace: semute
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: semute.hackathon.sev-2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autospec-web
                port:
                  number: 80
