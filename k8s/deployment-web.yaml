apiVersion: apps/v1
kind: Deployment
metadata:
  name: autospec-web
  namespace: semute
  labels:
    app.kubernetes.io/name: proyekautospec
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: proyekautospec
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proyekautospec
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/lifiuuu/proyekautospec:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: autospec-config
            - secretRef:
                name: autospec-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: cache
              mountPath: /var/www/html/bootstrap/cache
      volumes:
        - name: storage
          emptyDir: {}
        - name: cache
          emptyDir: {}
