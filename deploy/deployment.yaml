apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyek-autospec
  namespace: autospec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proyek-autospec
  template:
    metadata:
      labels:
        app: proyek-autospec
    spec:
      containers:
        - name: app
          image: your-registry/proyek-autospec:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
